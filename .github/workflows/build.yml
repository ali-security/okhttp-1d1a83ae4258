      - name: Run Checks
        run: ./gradlew test -Dtest.java.version=16

  testwindows:
    runs-on: windows-latest
    timeout-minutes: 50
    if: github.ref == 'refs/heads/okhttp_4x' || contains(github.event.pull_request.labels.*.name, 'windows')

    steps:
